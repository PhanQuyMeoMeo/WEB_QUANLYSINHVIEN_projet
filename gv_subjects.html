{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Môn học</h2>

<div class="card shadow-sm mb-4">
<div class="card-body">
<form method="post" class="row g-2 align-items-end">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-3">
        <label class="form-label">Mã môn</label>
        <input type="text" name="ma_mon" class="form-control" placeholder="VD: CSDL" required>
    </div>
    <div class="col-md-5">
        <label class="form-label">Tên môn</label>
        <input type="text" name="ten_mon" class="form-control" placeholder="VD: Cơ sở dữ liệu" required>
    </div>
    <div class="col-md-2">
        <label class="form-label">Số tín chỉ</label>
        <input type="number" name="so_tin_chi" class="form-control" min="1" max="10" value="3">
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">+ Thêm</button>
    </div>
</form>
</div>
</div>

<div class="card shadow-sm">
<table class="table table-hover mb-0">
    <thead class="table-light"><tr><th>Mã môn</th><th>Tên môn</th><th>Số tín chỉ</th><th>Thao tác</th></tr></thead>
    <tbody>
        {% for m in subjects %}
        <tr>
            <td>{{ m.ma_mon }}</td>
            <td>{{ m.ten_mon }}</td>
            <td>{{ m.so_tin_chi }}</td>
            <td>
                <a href="{{ url_for('gv_delete_subject', subject_id=m.id) }}" class="btn btn-sm btn-danger"
                   onclick="return confirm('Xóa môn {{ m.ten_mon }}? Điểm liên quan cũng sẽ bị xóa.');">Xóa</a>
            </td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="text-center text-muted py-4">Chưa có môn học nào.</td></tr>
        {% endfor %}
    </tbody>
</table>
</div>
{% endblock %}
